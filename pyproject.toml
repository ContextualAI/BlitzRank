[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blitzrank"
version = "0.1.1"
description = "Tournament graphs for Pareto-optimal zero-shot LLM reranking"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "litellm>=1.50.0",
    "httpx>=0.24.0",
    "tiktoken>=0.5.0",
    "loguru>=0.7.0",
    "PyYAML>=6.0",
    "tqdm>=4.65.0",
    "networkx>=3.0",
    "numpy>=1.24.0",
    "requests>=2.28.0",
    "datasets>=2.14.0",
    "orjson>=3.9.0",
    "pytrec-eval>=0.5",
]

[project.optional-dependencies]
all = [
    "torch>=2.0.0",
    "trueskill>=0.4.5",
    "scipy>=1.10.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["blitzrank*"]
